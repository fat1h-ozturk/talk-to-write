[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-to-write"
version = "0.1.0"
description = "High-performance, low-latency dictation and voice-to-text assistant for Linux"
authors = [{ name = "Fatih" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "evdev>=1.6.0",
]

[project.scripts]
talk-to-write = "talk_to_write.__main__:main"
