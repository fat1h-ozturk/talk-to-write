[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talk-to-write"
version = "0.2.0"
description = "High-performance, low-latency cross-platform dictation assistant for Linux, Windows, and macOS"
authors = [{ name = "Fatih" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "requests>=2.28.0",
    "pyaudio>=0.2.11",
    "webrtcvad-wheels>=2.0.10",
    "evdev>=1.6.0; platform_system=='Linux'",
    "pynput>=1.7.6; platform_system!='Linux'",
]

[project.scripts]
talk-to-write = "talk_to_write.__main__:main"

[tool.setuptools.packages.find]
include = ["talk_to_write*"]
